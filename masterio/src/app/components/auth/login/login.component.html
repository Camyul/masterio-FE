<div class="d-flex justify-content-center align-items-center container-fluid">
    <form class="row g-3" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class=" form-group">
            <label for="userName" class="">UserName</label>
            <input type="text" class="form-control" formControlName="username" id="userName">
        </div>
        <div class="alert alert-danger" *ngIf="username?.invalid && (username?.dirty || username?.touched)"> This field
            is
            required </div>
        <div class="form-group">
            <label for="inputPassword" class="">Password</label>
            <input type="password" class="form-control" formControlName="password" id="inputPassword">
        </div>
        <div class="alert alert-danger" *ngIf="password?.invalid && (password?.dirty || password?.touched)"> This field
            is
            required </div>
        <button type="submit" class="btn btn-primary">Login</button>
    </form>
</div>
