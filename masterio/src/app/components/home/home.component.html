<nav class="p-5">
    <a *ngIf="!userId" routerLink="/login">Login</a>
    <br>
    <a *ngIf="!userId" routerLink="/register">Register</a>
    <br>
    <a *ngIf="userId" routerLink="/home" (click)="logout()">Logout</a>
</nav>

<div class="d-flex card justify-content-center align-items-center container-fluid">
    <h2 class="text-center" *ngIf="!userId">You are not logged!</h2>
    <h1 class="text-center" *ngIf="userId">{{ userId }}</h1>
</div>
